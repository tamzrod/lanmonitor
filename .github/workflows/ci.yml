name: CI

on:
  push:
    branches: [main, "feature/**", "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BINARY: lanmonitor-v3.exe

jobs:
  test:
    name: Test and vet (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet (host)
        run: go vet ./...

      - name: Vet (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Unit tests with race detector
        run: go test -race ./...

      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
          "$(go env GOPATH)/bin/staticcheck" ./...
          GOOS=windows GOARCH=amd64 "$(go env GOPATH)/bin/staticcheck" ./...

  build:
    name: Build lanmonitor-v3.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Unit tests (windows)
        run: go test ./...

      - name: Build portable executable
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -H=windowsgui" -o "$BINARY" .
          ls -l "$BINARY"

      - name: Verify executable
        shell: bash
        run: |
          sha256sum "$BINARY" | tee SHA256SUMS.txt
          go version -m "$BINARY"

      - name: Check PE header
        shell: pwsh
        run: |
          $path = Join-Path "$env:GITHUB_WORKSPACE" "$env:BINARY"
          $bytes = [IO.File]::ReadAllBytes($path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $magic = [BitConverter]::ToUInt16($bytes, $pe + 24)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          "machine=0x{0:x4} magic=0x{1:x3} subsystem={2}" -f $machine, $magic, $subsystem
          if ($machine -ne 0x8664) { throw "expected an amd64 image, got machine 0x{0:x4}" -f $machine }
          if ($magic -ne 0x20b) { throw "expected PE32+, got magic 0x{0:x3}" -f $magic }
          if ($subsystem -ne 2) { throw "expected the Windows GUI subsystem, got $subsystem" }

      - name: Verify icon resource
        shell: bash
        run: go run ./cmd/verify-pe "$BINARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lanmonitor-v3-windows-amd64
          path: |
            ${{ env.BINARY }}
            SHA256SUMS.txt
          if-no-files-found: error
